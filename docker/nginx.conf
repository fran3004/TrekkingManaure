# Configuración de nginx para la aplicación de una sola página (SPA).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto: el JavaScript y el CSS viajan mucho más livianos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Una ruta que no existe responde 404 real (los buscadores no la toman por una página más),
    # con el sitio como cuerpo para que la persona siga navegando.
    error_page 404 /index.html;

    # Archivos con hash en el nombre (los genera Vite): nunca cambian, se cachean un año.
    # `^~` hace que este bloque gane sobre el de extensiones de abajo (las expresiones regulares
    # tienen prioridad sobre los prefijos normales).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fuentes con nombre fijo (las precarga index.html). Si una cambia, se renombra el archivo.
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sin comodín hacia index.html, un archivo estático que no existe devuelve 404 real.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Manifiesto de la aplicación: tipo explícito, por si el mime.types de nginx no lo trae.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # El panel no debe aparecer en buscadores: se puede rastrear, pero con noindex.
    # `rewrite ... break` entrega index.html sin salir de este bloque (try_files haría una
    # redirección interna a otro bloque y se perdería la cabecera X-Robots-Tag).
    location ^~ /admin {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # El sitio público es una sola página: / (y /index.html). index.html no se cachea para que
    # un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cualquier otra ruta sirve el archivo si existe (robots.txt, og-image.jpg...) o da 404.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
