# Configuración de nginx para la aplicación de una sola página (SPA).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto: el JavaScript y el CSS viajan mucho más livianos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos con hash en el nombre (los genera Vite): nunca cambian, se cachean un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sin comodín hacia index.html, un archivo estático que no existe devuelve 404 real.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?|txt|xml)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Manifiesto de la aplicación: tipo explícito, por si el mime.types de nginx no lo trae.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # El panel no debe aparecer en buscadores: se puede rastrear, pero con noindex.
    # `rewrite ... break` entrega index.html sin salir de este bloque (try_files haría una
    # redirección interna a `location /` y se perdería la cabecera X-Robots-Tag).
    location ^~ /admin {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Rutas de la aplicación (/, /admin, ...): siempre se entrega index.html y React decide
    # qué pantalla mostrar. Es la «reescritura de SPA» que pide el README para /admin.
    # index.html no se cachea para que un despliegue nuevo se vea de inmediato.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
