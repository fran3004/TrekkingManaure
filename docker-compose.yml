# Sitio público y panel (/admin), compilados y servidos por nginx.
#
#   docker compose up -d --build        -> http://localhost:8081
#
# La API vive en su propio repositorio (Trekkingbackend). Guía: docs/DOCKER.md

name: trekking-manaure

services:
  web:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:?Define VITE_API_URL con la URL publica de la API}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-meoo7p5s}
    image: trekking-manaure/web:latest
    ports:
      - '${WEB_PORT:-8081}:8080'
    restart: unless-stopped
